<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <!-- Permite que la aplicación se adapte correctamente a dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestor Escolar</title>
    <!-- Manifest -->
    <link rel="manifest" href="./manifest.json">
    <!-- Hoja de estilos principal -->
    <link rel="stylesheet" href="./css/styles.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
 
</head>

<body>

    <!--
        Contenedor principal de la aplicación.

        Las diferentes vistas serán cargadas dentro de este elemento
        mediante JavaScript.
    -->
    <main id="app"></main>

    <!--
        Punto de entrada de JavaScript.

        "type=module" nos permite utilizar import/export
        entre nuestros archivos JavaScript.
    -->
    <!--Cargamos el CDN de brypt para realizar el hash del password-->
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
    <script type="module" src="./src/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
  
</body>

</html>
